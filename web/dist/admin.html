<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天阙·神盾控制台 - 系统管理</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }
    .panel-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    .data-table th, .data-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--panel-border);
    }
    .data-table th {
      color: var(--text-sub);
      font-weight: 600;
      background: rgba(0, 0, 0, 0.1);
    }
    .data-table tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }
    .btn-sm {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--panel-border);
      background: var(--card-bg);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-sm:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }
    .btn-sm.danger:hover {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .code-box {
      background: #000;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: #38bdf8;
      word-break: break-all;
      user-select: all;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <!-- 头部 -->
    <header class="top-bar">
      <div class="site-brand">
        <span class="site-logo">⚙️</span>
        <span class="site-title">天阙·神盾安全管理后台</span>
      </div>
      <div class="top-actions">
        <a href="/" class="btn-sm" style="text-decoration: none; padding: 8px 14px;">返回监控大屏</a>
        <button id="btnLogout" class="btn-sm danger" style="padding: 8px 14px;">退出登录</button>
      </div>
    </header>

    <!-- 节点管理面板 -->
    <section class="panel">
      <div class="panel-title">
        <span>受控节点列表 (集群管理)</span>
        <button id="btnAddNode" class="btn-primary" style="width: auto; padding: 6px 16px; font-size: 13px;">+ 添加新节点</button>
      </div>
      <div style="overflow-x: auto;">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>节点名称</th>
              <th>国旗/地区</th>
              <th>系统</th>
              <th>分组</th>
              <th>计费标签</th>
              <th>到期时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="nodeTableBody">
            <!-- 动态渲染 -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- 系统全局与告警配置 -->
    <section class="panel">
      <div class="panel-title">
        <span>系统全局与 Telegram 告警配置</span>
      </div>
      <form id="settingsForm">
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">大屏站点标题</label>
            <input type="text" id="cfgSiteTitle" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">大屏访问模式</label>
            <select id="cfgAccessMode" class="form-input">
              <option value="public">公开模式 (任何人免密查看)</option>
              <option value="private">私密模式 (毛玻璃密码锁屏)</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">管理员密码 (留空或******表示不修改)</label>
            <input type="password" id="cfgAdminPassword" class="form-input" placeholder="******">
          </div>
          <div class="form-group">
            <label class="form-label">掉线判定超时阈值 (秒)</label>
            <input type="number" id="cfgOfflineSec" class="form-input" value="60" required>
          </div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--panel-border); margin: 20px 0;">

        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" id="cfgTGEnabled" style="width: 18px; height: 18px; cursor: pointer;">
          <label for="cfgTGEnabled" class="form-label" style="margin: 0; cursor: pointer;">启用 Telegram 智能告警中枢 (掉线/上线/账单到期)</label>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Telegram Bot Token</label>
            <input type="text" id="cfgTGBotToken" class="form-input" placeholder="例如 123456789:ABCdefGHIjkl...">
          </div>
          <div class="form-group">
            <label class="form-label">Telegram Chat ID</label>
            <input type="text" id="cfgTGChatID" class="form-input" placeholder="例如 -100123456789 或 987654321">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Telegram 网络代理 (可选，国内服务器请配置 Socks5/HTTP 代理)</label>
          <input type="text" id="cfgTGProxy" class="form-input" placeholder="例如 socks5://127.0.0.1:10808 或 http://127.0.0.1:7890">
        </div>

        <div style="display: flex; gap: 12px; margin-top: 20px;">
          <button type="submit" class="btn-primary" style="width: auto; padding: 10px 24px;">保存系统配置</button>
          <button type="button" id="btnTestTG" class="btn-sm" style="padding: 10px 18px;">🔔 发送 TG 测试消息</button>
        </div>
      </form>
    </section>
  </div>

  <!-- 节点编辑模态框 -->
  <div class="modal-overlay" id="nodeModal" style="display: none;">
    <div class="modal-box" style="max-width: 500px; text-align: left;">
      <h2 class="modal-title" id="nodeModalTitle">配置节点</h2>
      <form id="nodeForm">
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">节点唯一 ID</label>
            <input type="text" id="nodeId" class="form-input" placeholder="hk-relay-01" required>
          </div>
          <div class="form-group">
            <label class="form-label">节点名称</label>
            <input type="text" id="nodeName" class="form-input" placeholder="香港-30M-122" required>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">国旗 Emoji</label>
            <input type="text" id="nodeFlag" class="form-input" placeholder="🇭🇰" value="🇭🇰">
          </div>
          <div class="form-group">
            <label class="form-label">地区代码</label>
            <input type="text" id="nodeRegion" class="form-input" placeholder="HK" value="HK">
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">系统图标</label>
            <select id="nodeOS" class="form-input">
              <option value="debian">Debian</option>
              <option value="ubuntu">Ubuntu</option>
              <option value="alpine">Alpine</option>
              <option value="centos">CentOS</option>
              <option value="windows">Windows</option>
              <option value="linux">通用 Linux</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">分组名称</label>
            <input type="text" id="nodeGroup" class="form-input" placeholder="中转" value="中转">
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">计费标签</label>
            <input type="text" id="nodePrice" class="form-input" placeholder="$29.99/月">
          </div>
          <div class="form-group">
            <label class="form-label">到期时间 (YYYY-MM-DD)</label>
            <input type="date" id="nodeExpireDate" class="form-input">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">认证 Token (留空自动生成)</label>
          <input type="text" id="nodeToken" class="form-input" placeholder="留空则服务端自动生成">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
          <button type="button" class="btn-sm" id="btnCancelNode">取消</button>
          <button type="submit" class="btn-primary" style="width: auto; padding: 8px 20px;">确定保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 一键安装命令展示弹窗 -->
  <div class="modal-overlay" id="cmdModal" style="display: none;">
    <div class="modal-box" style="max-width: 600px; text-align: left;">
      <h2 class="modal-title">🛡️ Agent 一键安全安装命令</h2>
      <p class="modal-desc" style="margin-bottom: 12px;">登录目标受控服务器终端，直接复制执行下方命令：</p>
      <div class="code-box" id="cmdText"></div>
      <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 16px;">
        * 安装脚本将自动创建受限普通用户 <code>nobody:nogroup</code>，单向推送指标，无需暴露任何公网入站端口。
      </p>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" class="btn-sm" id="btnCloseCmd">关闭</button>
        <button type="button" class="btn-primary" id="btnCopyCmd" style="width: auto; padding: 8px 20px;">📋 复制命令</button>
      </div>
    </div>
  </div>

  <!-- 后台登录弹层 (未登录时显示) -->
  <div class="modal-overlay" id="loginModal" style="display: none;">
    <div class="modal-box">
      <div class="modal-icon">🔐</div>
      <h2 class="modal-title">管理员身份验证</h2>
      <p class="modal-desc">请输入管理员密码进入控制台</p>
      <form id="adminLoginForm">
        <div class="form-group">
          <input type="password" id="adminPassword" class="form-input" placeholder="请输入密码..." required autofocus>
        </div>
        <div class="error-text" id="adminLoginError"></div>
        <button type="submit" class="btn-primary">验证登录</button>
      </form>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
